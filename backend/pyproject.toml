[project]
name = "backend"
version = "0.1.0"
description = "Prelegal API and static frontend server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
